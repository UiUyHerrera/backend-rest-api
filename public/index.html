<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Shop</h1>
  <span id="roleTag" class="tag hidden"></span>
  <div class="spacer"></div>
  <span id="userLabel"></span>
  <button id="logoutBtn" class="btn btn-gray hidden">Cerrar sesión</button>
</header>

<main>
  <section>
    <div class="card" style="margin-bottom:18px">
      <div id="loginBox" class="login">
        <input id="loginEmail" type="email" placeholder="email" value="pepeito@example.com">
        <input id="loginPass" type="password" placeholder="contraseña" value="cliente123">
        <button id="loginBtn" class="btn btn-green">Entrar</button>
      </div>

      <h2>Productos</h2>
      <div class="row" style="margin-bottom:14px">
        <input id="search" type="search" placeholder="Buscar..." style="flex:1; min-width:180px">
        <button id="searchBtn" class="btn btn-dark">Buscar</button>
      </div>
      <div id="productGrid" class="grid"><div class="empty">Cargando...</div></div>
    </div>

    <div class="card">
      <h2>Mis pedidos</h2>
      <div id="ordersList"><div class="empty">Iniciá sesión para ver tus pedidos.</div></div>
    </div>
  </section>

  <aside>
    <div class="card hidden" id="statsCard" style="margin-bottom:18px">
      <h2>Resumen</h2>
      <div class="stats">
        <div class="stat"><b id="statOrders">-</b><span>Pedidos</span></div>
        <div class="stat"><b id="statPending">-</b><span>Pendientes</span></div>
        <div class="stat"><b id="statProducts">-</b><span>Productos</span></div>
        <div class="stat"><b id="statUsers">-</b><span>Usuarios</span></div>
      </div>
    </div>

    <div class="card">
      <h2>Carrito</h2>
      <div id="cartItems"><div class="empty">El carrito está vacío.</div></div>
      <div class="cart-total hidden" id="cartTotalWrap">
        <span>Total</span>
        <span id="cartTotal">$0.00</span>
      </div>
      <button id="orderBtn" class="btn btn-green hidden" style="width:100%; margin-top:12px">Comprar</button>
    </div>
  </aside>
</main>

<div id="toast" class="toast"></div>

<script src="app.js" defer></script>
</body>
</html>
